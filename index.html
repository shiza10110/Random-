<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#020604">
<title>NET://SCAN</title>
<style>
:root{--g:#00ff91;--dim:#75c6a1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020403;color:#eafff3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at center,#052013 0,#020604 55%,#000 100%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0 3px,#00ff91 4px);background-size:100% 5px}.scene{position:relative;width:min(100vw,100svh);height:min(100vw,100svh);display:grid;place-items:center}.globe{position:absolute;width:88%;aspect-ratio:1;border-radius:50%;border:1px solid #00ff9160;opacity:.94;background:radial-gradient(circle at 50% 48%,transparent 49%,#00ff9140 50%,transparent 51%),repeating-radial-gradient(circle at center,transparent 0 12%,#00ff9118 12.2% 12.5%,transparent 12.7% 22%),repeating-linear-gradient(0deg,transparent 0 9%,#00ff9125 9.2% 9.5%,transparent 9.7% 18%),repeating-linear-gradient(90deg,transparent 0 9%,#00ff9125 9.2% 9.5%,transparent 9.7% 18%);box-shadow:inset 0 0 60px #00ff911a,0 0 50px #00ff911a;animation:rotate 35s linear infinite}.globe:before{content:"";position:absolute;inset:3%;border-radius:50%;border:2px solid #00ff9177;box-shadow:0 0 24px #00ff9140,inset 0 0 24px #00ff9125;background:radial-gradient(ellipse at 30% 35%,#00ff9125 0 2%,transparent 3% 100%),radial-gradient(ellipse at 68% 30%,#00ff9128 0 5%,transparent 6%),radial-gradient(ellipse at 54% 66%,#00ff9120 0 9%,transparent 10%)}.globe:after{content:"";position:absolute;inset:15% -9%;border:1px solid #00ff916b;border-radius:50%;transform:rotate(-28deg)}@keyframes rotate{to{transform:rotate(360deg)}}.orbit{position:absolute;width:67%;aspect-ratio:1;border:2px solid var(--g);border-radius:50%;box-shadow:0 0 18px #00ff9166,inset 0 0 18px #00ff9122;display:grid;place-items:center}.orbit:before,.orbit:after{content:"";position:absolute;inset:-7%;border:1px solid #00ff914d;border-radius:50%}.orbit:after{inset:5%;border-style:dashed;animation:rotate 25s linear infinite}.start{position:relative;z-index:2;width:76%;aspect-ratio:1;border-radius:50%;border:2px solid var(--g);background:radial-gradient(circle,#06180f 0,#010503 72%);color:var(--g);font-family:inherit;font-size:clamp(1.5rem,5.5vw,3.6rem);font-weight:900;letter-spacing:.13em;text-shadow:0 0 22px #00ff91a8;box-shadow:0 0 20px #00ff9180,inset 0 0 28px #00ff9124;cursor:pointer}.start:hover{box-shadow:0 0 42px #00ff91c9,inset 0 0 35px #00ff9140}.results{display:none;z-index:4;position:relative;width:min(480px,86vw);padding:clamp(20px,4vw,36px);background:#020805f2;border:1px solid #00ff91a6;box-shadow:0 0 45px #00ff912c,inset 0 0 35px #00ff910b;backdrop-filter:blur(8px)}.results.show{display:block;animation:appear .4s ease-out}.results h1{font-size:clamp(1.1rem,3vw,1.5rem);letter-spacing:.15em;color:var(--g);text-align:center;margin:0 0 22px}.item{padding:15px 0;border-bottom:1px solid #00ff913b}.item:last-child{border-bottom:0}.label{color:var(--dim);font-size:.78rem;letter-spacing:.12em;margin-bottom:7px}.value{font-size:clamp(.95rem,2.8vw,1.2rem);overflow-wrap:anywhere;color:#effff5}.value.ready{color:var(--g)}.bottom{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#39795b;font-size:.68rem;letter-spacing:.1em;padding:0 10px}.music-state{position:fixed;top:15px;right:17px;color:var(--g);font-size:.7rem;letter-spacing:.1em}.hide{display:none!important}@keyframes appear{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@media(max-width:560px){.scene{width:100vw;height:100vw;max-height:100svh}.globe{width:94%}.orbit{width:76%}.results{width:88vw}.item{padding:12px 0}.bottom{font-size:.58rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body>
<main class="scene" id="scene"><div class="globe" aria-hidden="true"></div><div class="orbit" id="orbit"><button class="start" id="startBtn" type="button">START</button></div>
<section class="results" id="results" aria-live="polite"><h1>WYNIKI SKANOWANIA</h1><div class="item"><div class="label">IP:</div><div class="value" id="ip">Sprawdzanie…</div></div><div class="item"><div class="label">DOSTAWCA:</div><div class="value" id="isp">Sprawdzanie…</div></div><div class="item"><div class="label">PRZESYŁ DANYCH / LOKALIZACJA:</div><div class="value" id="location">Ustalanie przybliżonej lokalizacji…</div></div><button id="againBtn" type="button" style="margin-top:18px;padding:10px 14px;background:transparent;border:1px solid #00ff91;color:#00ff91;font:inherit;cursor:pointer;width:100%">SPRÓBUJ PONOWNIE</button></section></main>
<div class="music-state" id="musicState">♫ AUDIO: OFF</div><div class="bottom" id="bottom">NET://SCAN • KLIKNIJ START, ABY ROZPOCZĄĆ</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const startBtn=$('startBtn'),orbit=$('orbit'),results=$('results'),musicState=$('musicState'),bottom=$('bottom');let audioCtx=null,master=null,musicTimer=null,musicOn=false,noteIndex=0;
function startMusic(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){musicState.textContent='♫ AUDIO NIEDOSTĘPNE';return}if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();if(musicOn)return;master=audioCtx.createGain();master.gain.value=.12;master.connect(audioCtx.destination);musicOn=true;musicState.textContent='♫ PHONK: ON';const bass=[55,55,65.41,55,73.42,65.41,55,49],lead=[220,0,261.63,0,196,0,164.81,0];musicTimer=window.setInterval(()=>{if(!audioCtx||!master)return;const t=audioCtx.currentTime;const b=audioCtx.createOscillator(),bg=audioCtx.createGain();b.type='sawtooth';b.frequency.setValueAtTime(bass[noteIndex%bass.length],t);bg.gain.setValueAtTime(.0001,t);bg.gain.exponentialRampToValueAtTime(.18,t+.02);bg.gain.exponentialRampToValueAtTime(.0001,t+.18);b.connect(bg);bg.connect(master);b.start(t);b.stop(t+.19);const f=lead[noteIndex%lead.length];if(f){const s=audioCtx.createOscillator(),sg=audioCtx.createGain();s.type='triangle';s.frequency.setValueAtTime(f,t);sg.gain.setValueAtTime(.0001,t);sg.gain.exponentialRampToValueAtTime(.045,t+.02);sg.gain.exponentialRampToValueAtTime(.0001,t+.15);s.connect(sg);sg.connect(master);s.start(t);s.stop(t+.16)}noteIndex++},220)}catch(err){musicState.textContent='♫ AUDIO NIEDOSTĘPNE'}}
async function scan(){startMusic();orbit.classList.add('hide');results.classList.add('show');bottom.textContent='POBIERANIE DANYCH SIECI…';$('ip').textContent='Sprawdzanie…';$('isp').textContent='Sprawdzanie…';$('location').textContent='Ustalanie przybliżonej lokalizacji…';$('ip').classList.remove('ready');$('isp').classList.remove('ready');$('location').classList.remove('ready');try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);let response;try{response=await fetch('https://ipapi.co/json/',{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('Serwis IP zwrócił błąd');const d=await response.json();if(d.error)throw Error(d.reason||'Błąd serwisu IP');$('ip').textContent=d.ip||'Nie udało się ustalić';$('isp').textContent=d.org||d.asn||'Nie udało się ustalić';$('location').textContent=[d.city,d.region,d.country_name].filter(Boolean).join(', ')||'Nie udało się ustalić';['ip','isp','location'].forEach(id=>$(id).classList.add('ready'));bottom.textContent='GOTOWE • LOKALIZACJA JEST PRZYBLIŻONA'}catch(err){$('ip').textContent='Nie udało się pobrać';$('isp').textContent='Nie udało się pobrać';$('location').textContent='Serwis niedostępny — sprawdź połączenie i spróbuj ponownie';bottom.textContent='NIE UDAŁO SIĘ POBRAĆ DANYCH • KLIKNIJ SPRÓBUJ PONOWNIE'}}
startBtn.addEventListener('click',scan);$('againBtn').addEventListener('click',scan);
})();
</script></body></html>
